# BAM configuration. One setting per line.
# Override without editing this file:
#   BAM_BATCH_SIZE=16 python run.py
#   python run.py --set port=8001

# ---------------------------------------------------------------------- paths
datasets_dir: ./datasets          # folder holding every dataset
dataset: demo                     # which dataset to train on
model_path: ./model/bam_v1.pth
onnx_path: ./model/bam_v1.onnx
onnx_int8_path: ./model/bam_v1_int8.onnx
runs_dir: ./runs

# ----------------------------------------------------------------- resolution
short_side: 640                   # images are downscaled to this short side
crop_size: 256                    # training crop, and the largest inference crop
crop_min: 64                      # smallest inference crop
crop_ratio: 0.4                   # inference crop / canvas short side
crop_stride: 128                  # spacing between crops along a brush stroke
target_sigma: 1.0                 # width of the soft edge target
num_workers: 8                    # dataloader workers

# ---------------------------------------------------------- brush synthesis
brush_radius_min: 1.5             # brush radius range, canonical px
brush_radius_max: 6.0
brush_jitter: 3.0                 # global offset sigma
brush_wobble_amp: [1.0, 4.0]
brush_wobble_len: [20.0, 180.0]
brush_coverage: [1.00, 1.00]      # fraction of each contour covered
brush_simplify: [2.0, 10.0]       # RDP epsilon range
brush_smooth: [5, 21]
brush_max_offset: 12.0
brush_encoding: binary            # binary | sdf
# Off by default: these make the brush cover less than the edge, which would
# leave the 4th channel and the target describing different things.
p_no_brush: 0.0
p_distractor: 0.0
p_interior: 0.0
p_partial: 0.0
p_two_arcs: 0.0
p_dry_brush: 0.0

# ---------------------------------------------------------------- crop mixture
mix_boundary: 0.50
mix_near: 0.20
mix_empty: 0.15
mix_dense: 0.15

# ----------------------------------------------------------------------- model
width: 20                         # base channel width (16 / 20 / 24 / 32)
depth: 4                          # encoder/decoder levels
max_width: 256
block: ds                         # ds | vanilla
bilinear: true

# -------------------------------------------------------------------- training
seed: 1337
train_device: auto                # auto | cpu | cuda
batch_size: 32
crops_per_epoch: 24000
val_crops: 2000
epochs: 60
lr: 0.0003
weight_decay: 0.0001
warmup_epochs: 3
amp: true
ema_decay: 0.999
grad_clip: 1.0
early_stop: 15
pos_weight: 6.0

# ------------------------------------------------------------------- inference
infer_device: cpu                 # cpu | cuda
backend: auto                     # auto | onnx_int8 | onnx_fp32 | torch | mock
max_crops: 64
infer_batch: 16
threads: 8
threshold: 0.5
edge_threshold: 0.45
sensitivity: 1.0
expand: 0
smooth: 2
mode: line                        # line = predict the edge, object = also fill
line_width: 3                     # predicted line thickness, canvas px
fill_close: 5                     # px of gap bridged before filling a line
merge_weighting: uniform          # uniform | gaussian
apply_dbscan: false
apply_morphology: true
morph_kernel: 3
morph_iterations: 2
cache_entries: 2048
allow_mock: true

# ---------------------------------------------------------------------- server
host: "127.0.0.1"
port: 8000
max_upload_mb: 24
debug: false
max_canvas_side: 2048

# ------------------------------------------------------------------------ data
tier: A                           # A = shippable, B = research only
